name: Tests

on:
 push:
  branches: [main, master, develop]
 pull_request:

jobs:
 phpunit:
  runs-on: ubuntu-latest
  services:
   mysql:
    image: mysql:8.0
    env:
     MYSQL_ROOT_PASSWORD: root
     MYSQL_DATABASE: wordpress_test
    ports:
     - 3306:3306
    options: >-
     --health-cmd="mysqladmin ping"
     --health-interval=10s
     --health-timeout=5s
     --health-retries=3

  steps:
   - uses: actions/checkout@v4

   - name: Setup PHP
     uses: shivammathur/setup-php@v2
     with:
      php-version: '8.2'
      extensions: mysqli
      tools: composer, phpunit

   - name: Install Composer deps
     run: composer install --no-interaction --prefer-dist

   - name: Install WordPress test library
     run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
     env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress/

   - name: PHPUnit
     run: vendor/bin/phpunit
     env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress/

 e2e:
  runs-on: ubuntu-latest
  needs: phpunit
  if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

  steps:
   - uses: actions/checkout@v4

   - uses: actions/setup-node@v4
     with:
      node-version: '20'

   - name: Install npm deps
     run: npm ci

   - name: Install Playwright browsers
     run: npx playwright install chromium --with-deps

   - name: Start wp-env
     run: npx wp-env start

   - name: Activate plugin
     run: npx wp-env run cli wp plugin activate edminboost-admin-notice-manager

   - name: E2E tests
     run: npm run test:e2e
     env:
      E2E_BASE_URL: http://localhost:8888
      E2E_WP_USER: admin
      E2E_WP_PASSWORD: password

   - name: Upload Playwright report
     if: failure()
     uses: actions/upload-artifact@v4
     with:
      name: playwright-report
      path: test-results/
